<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Shahodty 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fcf6ec; --cream2:#f4e8d6; --pink:#e8a6b6; --pink-soft:#f6d3dc;
  --rose:#c9778c; --ink:#6b4a4f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  height:100%; color:var(--ink); font-family:'Tajawal',system-ui,sans-serif; overflow-x:hidden; overflow-y:auto;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%, rgba(246,211,220,.55), transparent 70%),
    radial-gradient(ellipse 60% 40% at 90% 95%, rgba(246,211,220,.5), transparent 70%),
    radial-gradient(circle at 50% 40%, var(--cream) 0%, var(--cream2) 100%);
}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1rem;text-align:center;position:relative;z-index:2}

h1{
  margin:0; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-weight:600;
  font-size:clamp(2.7rem,13vw,4.4rem); color:var(--rose); letter-spacing:.02em; direction:ltr;
  text-shadow:0 2px 14px rgba(232,166,182,.35); transition:font-size 1s ease;
}
.opened h1{font-size:clamp(1.8rem,8vw,2.4rem)}

/* gift box */
#gift{width:clamp(96px,28vw,125px);height:auto;overflow:visible;animation:bob 4s ease-in-out infinite;transition:opacity .5s ease, transform .5s ease}
#gift .lid{transform-origin:25% 100%;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
#gift.lift .lid{transform:translate(-4px,-30px) rotate(-14deg)}
#gift.gone{opacity:0;transform:scale(.8)}
.opened #gift{display:none}

#openBtn{
  font-family:'Aref Ruqaa','Tajawal',serif; font-size:1.2rem; font-weight:700; color:var(--rose);
  background:rgba(255,255,255,.6); border:1.5px solid var(--pink); border-radius:999px;
  padding:.55rem 1.8rem; cursor:pointer; box-shadow:0 6px 18px rgba(201,119,140,.16);
  transition:transform .25s ease, background .25s ease, opacity .5s ease; position:relative; overflow:hidden;
}
#openBtn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
#openBtn:hover{background:var(--pink-soft);transform:translateY(-2px)}
#openBtn:active{transform:scale(.97)}
#openBtn:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.hide-btn #openBtn{opacity:0;pointer-events:none}
.opened #openBtn{display:none}

/* stage */
#stage{display:none;flex-direction:column;align-items:center;gap:.8rem}
.opened #stage{display:flex}
.items{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(.4rem,3vw,1.4rem);direction:ltr}
#flower{width:clamp(115px,min(40vw,25vh),190px);height:auto;overflow:visible}
#flowerWrap{transform-origin:50% 100%}
#flowerWrap.float{animation:sway 5s ease-in-out infinite}
#choc{width:clamp(62px,min(22vw,14vh),100px);height:auto;overflow:visible;opacity:0;transform:translateY(14px) scale(.85);transition:opacity 1s ease, transform 1s cubic-bezier(.2,.8,.3,1);margin-bottom:6px}
#choc.show{opacity:1;transform:none}
#choc.show.float{animation:bob 5s ease-in-out -1.5s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(-7px) rotate(.8deg)}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}

/* drawing */
.d{fill-opacity:0;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round;stroke-linejoin:round}
.go .d{animation:draw var(--t,1s) ease-in-out var(--d,0s) forwards, fillin .8s ease calc(var(--d,0s) + var(--t,1s) * .85) forwards}
.go .stem{animation:draw var(--t,1s) ease-in-out var(--d,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}

/* text */
.msg,.sub{opacity:0;transform:translateY(10px);transition:opacity 1.1s ease, transform 1.1s ease;margin:0}
.msg{font-family:'Aref Ruqaa','Tajawal',serif;font-size:clamp(1.6rem,7vw,2.2rem);font-weight:700;color:var(--ink)}
.sub{font-size:clamp(1rem,4.2vw,1.2rem);color:var(--rose);font-weight:500}
.msg.show,.sub.show{opacity:1;transform:none}

/* sparkles */
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.p{position:absolute;bottom:-20px;color:var(--pink);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.35}85%{opacity:.25}100%{transform:translateY(-110vh) translateX(var(--x,10px));opacity:0}}
.sp{position:absolute;color:var(--pink);font-size:.8rem;opacity:0;display:none;animation:tw 3s ease-in-out infinite}
.show-sp .sp{display:block}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.75;transform:scale(1)}}
.burst{position:absolute;left:35%;top:30%;color:var(--pink);font-size:.9rem;pointer-events:none;animation:burst 1.5s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}

.photo{position:relative;width:clamp(64px,13vh,88px);aspect-ratio:1;border-radius:50%;opacity:0;transform:scale(.8);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.3,1)}
.photo.show{opacity:1;transform:none}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--pink),0 8px 22px rgba(201,119,140,.28);display:block}
.photo::after{content:"🎀";position:absolute;top:-9px;right:-6px;font-size:1.2rem}
/* extras */
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--pink);background:rgba(255,255,255,.6);font-size:1rem;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.opened #mute{display:flex}
#replay{font-family:inherit;font-size:.95rem;color:var(--rose);background:none;border:none;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s ease;padding:.3rem .8rem}
#replay.show{opacity:.85;pointer-events:auto}
#replay:hover{opacity:1}
.secret{margin:0;min-height:1.6em;font-family:'Aref Ruqaa','Tajawal',serif;font-size:1.1rem;color:var(--rose);opacity:0;transition:opacity .6s ease}
.secret.show{opacity:1}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hrt{position:absolute;pointer-events:none;color:var(--pink);font-size:1rem;animation:hup 1.6s ease-out forwards}
@keyframes hup{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-80px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){#flowerWrap.float,#choc.show.float,#gift,.p,#openBtn::after{animation:none}}
</style>
</head>

<button id="mute" type="button" aria-label="الصوت">🔊</button>

(function(){
  const bg=document.getElementById('bg'), sym=['♡','♥','✦'];
  for(let i=0;i<12;i++){
    const e=document.createElement('span'); e.className='p'; e.textContent=sym[i%3];
    e.style.left=(Math.random()*96)+'%';
    e.style.fontSize=(9+Math.random()*9)+'px';
    e.style.setProperty('--x',(Math.random()*40-20)+'px');
    e.style.animationDuration=(14+Math.random()*12)+'s';
    e.style.animationDelay=(-Math.random()*20)+'s';
    bg.appendChild(e);
  }
})();

let ac,muted=false;
function tone(f,t=0,d=1.6,v=.03){
  if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.04);g.gain.exponentialRampToValueAtTime(.0001,n+d);
  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05);
}
function startMusic(){
  try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const mel=[523,659,784,659,880,784,659,587];let i=0;
  setInterval(()=>{const f=mel[i%8];tone(f,0,1.9,.022);if(i%4===0)tone(f/2,0,2.6,.018);i++},950);
}
const secrets=['إنتي أحلى حاجة في يومي 🎀','كل خطوة في الجيم بتقربك لأحلامك ✨','فخور بيكي دايمًا 🤍','بتقدري على كل حاجة 💪🏻'];
const $=id=>document.getElementById(id), app=$('app'), at=(ms,fn)=>setTimeout(fn,ms+1000);
$('openBtn').addEventListener('click',()=>{
  $('openBtn').disabled=true; startMusic(); tone(880,0,1.2,.04);
  app.classList.add('hide-btn'); $('gift').classList.add('lift');
  setTimeout(()=>$('gift').classList.add('gone'),650);
  at(0,()=>{
    app.classList.add('opened'); setTimeout(()=>$('photo').classList.add('show'),100);
    requestAnimationFrame(()=>requestAnimationFrame(()=>$('flower').classList.add('go')));
  });
  at(6700,()=>{
    $('flowerWrap').classList.add('float'); $('choc').classList.add('show'); app.classList.add('show-sp'); [784,988,1175,1568].forEach((f,k)=>tone(f,k*.18,1.8,.04)); $('choc').classList.add('tap'); $('flowerWrap').classList.add('tap');
    const it=$('items');
    for(let i=0;i<9;i++){
      const s=document.createElement('span'); s.className='burst'; s.textContent=i%2?'✦':'♡';
      const a=i/9*Math.PI*2, r=70+Math.random()*30;
      s.style.setProperty('--dx',Math.cos(a)*r+'px'); s.style.setProperty('--dy',Math.sin(a)*r+'px');
      it.appendChild(s); setTimeout(()=>s.remove(),1600);
    }
  });
  at(7700,()=>$('choc').classList.add('float'));
  at(7900,()=>$('msg').classList.add('show'));
  at(9300,()=>$('sub').classList.add('show'));
  at(11000,()=>$('replay').classList.add('show'));
});

$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'});
$('replay').addEventListener('click',()=>location.reload());
$('flowerWrap').addEventListener('click',e=>{
  if(!$('flowerWrap').classList.contains('tap'))return;
  const it=$('items'),r=it.getBoundingClientRect();
  tone(1047,0,1,.03);
  for(let i=0;i<5;i++){
    const h=document.createElement('span');h.className='hrt';h.textContent=i%2?'♡':'♥';
    h.style.left=(e.clientX-r.left+(Math.random()*30-15))+'px';h.style.top=(e.clientY-r.top)+'px';
    h.style.setProperty('--dx',(Math.random()*60-30)+'px');
    it.appendChild(h);setTimeout(()=>h.remove(),1700);
  }
});
let sk=0;
$('choc').addEventListener('click',()=>{
  if(!$('choc').classList.contains('tap'))return;
  const el=$('secret');el.classList.remove('show');
  tone(698,0,1,.03);tone(880,.12,1.2,.03);
  setTimeout(()=>{el.textContent=secrets[sk++%secrets.length];el.classList.add('show')},250);
});
</script>
</body>
</html>
